</head>

<body>
<div class="navbar">
<div class="logo">HealthConnect</div>

<ul class="nav-links">

<li><a href="appointments.html">Appointments</a></li>

<section class="history-section">

<h1>Patient History</h1>
<div class="search-container">

<input
type="text"
id="searchInput"
placeholder="Search Department"
onkeyup="searchAppointments()"
>

<button class="search-btn" onclick="searchAppointments()">
Search
</button>

</div>
<table class="history-table">

<thead>
<tr>
<th>Patient Name</th>
<th>Age</th>
<th>Department</th>
<th>Service</th>
<th>Doctor</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="historyTable">

</tbody>

</table>

</section>

<script src="patient-history.js"></script>
